<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#d71920" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Dirshay" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="icon" href="/icon.png" />
    <title>Dirshay</title>
    <script>
      (function () {
        var key = "motora-sw-reset-v3";
        try {
          if (localStorage.getItem(key)) return;
          localStorage.setItem(key, "1");
        } catch (e) {}
        if (!("serviceWorker" in navigator)) return;
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (r) { return r.unregister(); }));
        }).then(function () {
          if (!("caches" in window)) return;
          return caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          });
        }).then(function () {
          location.reload();
        });
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body {
        background: #111;
        color: #fff;
        font-family: system-ui, sans-serif;
      }
      .boot {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        font-family: Syne, system-ui, sans-serif;
        font-weight: 800;
        letter-spacing: -0.8px;
        font-size: 28px;
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot">Dirshay</div></div>
    <script type="module">
      import("/src/main.tsx").catch((err) => {
        const root = document.getElementById("root");
        if (root) {
          root.innerHTML =
            "<pre style='white-space:pre-wrap;padding:24px;color:#fecaca'>" +
            String(err && err.stack ? err.stack : err) +
            "</pre>";
        }
      });
    </script>
  </body>
</html>
